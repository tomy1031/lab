<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NEXTMAKE — Investor MV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: 'NSJP'; src: url(fonts/NotoSansJP.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'SERIF'; src: url(fonts/NotoSerifJP.woff2) format('woff2'); font-weight: 200 900; font-display: block; }
@font-face { font-family: 'MONT'; src: url(fonts/Montserrat.woff2) format('woff2'); font-weight: 100 900; font-display: block; }

:root {
  --navy: #040a18;
  --navy2: #0a1733;
  --blue: #1f6fff;
  --brand: #0b5aa8;
  --brand2: #1a8fe0;
  --cyan: #45d6ff;
  --gold: #f0c96b;
  --muted: #9fb2d4;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body.preview { display: grid; place-items: center; min-height: 100vh; }
#viewport { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; }
#stage {
  position: absolute; inset: 0; overflow: hidden; background: var(--navy);
  font-family: 'NSJP', sans-serif; color: #fff;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
#world { position: absolute; inset: 0; }
#bg { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }
.center-x { left: 0; right: 0; text-align: center; }
.photo { position: absolute; overflow: hidden; background: #000; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
.ch { display: inline-block; white-space: pre; will-change: transform, opacity; }
.mont { font-family: 'MONT', 'NSJP', sans-serif; }
.serif { font-family: 'SERIF', serif; }
.label {
  font-family: 'MONT', sans-serif; font-weight: 700; letter-spacing: .32em; font-size: 20px;
  color: var(--cyan); text-transform: uppercase;
}
.glow { text-shadow: 0 0 28px rgba(69, 214, 255, .45), 0 0 2px rgba(255,255,255,.4); }
.grad {
  background: linear-gradient(180deg, #ffffff 25%, #8fe3ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.shade-l { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,10,24,.94) 0%, rgba(4,10,24,.78) 38%, rgba(4,10,24,.15) 72%, rgba(4,10,24,0) 100%); }
.shade-b { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(4,10,24,.95) 0%, rgba(4,10,24,.55) 40%, rgba(4,10,24,0) 75%); }
.shade-all { position: absolute; inset: 0; background: rgba(4,10,24,.58); }
.tint { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(31,111,255,.35), rgba(4,10,24,.2)); mix-blend-mode: multiply; }
.chip {
  display: inline-block; padding: 12px 24px; margin: 0 12px 12px 0; border-radius: 999px;
  border: 1.5px solid rgba(69,214,255,.55); background: rgba(10,30,70,.55);
  font-size: 24px; font-weight: 700; letter-spacing: .04em; color: #e8f6ff;
  backdrop-filter: blur(6px);
}
.card {
  border-radius: 20px; background: rgba(8,20,48,.86); border: 1px solid rgba(120,190,255,.25);
  box-shadow: 0 30px 80px rgba(0,0,0,.45);
}
.hline { position: absolute; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); }

/* logo */
.logo { display: flex; align-items: center; gap: .32em; font-family: 'MONT', sans-serif; font-weight: 400; letter-spacing: .04em; line-height: 1; color: #fff; }
.logo svg { height: .74em; width: auto; overflow: visible; }

/* overlays */
#flash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,1) 0%, rgba(160,225,255,.85) 35%, rgba(40,120,255,.25) 75%); opacity: 0; mix-blend-mode: screen; }
#grain { position: absolute; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
#hud { position: absolute; inset: 0; pointer-events: none; font-family: 'MONT', sans-serif; }
#hud .tl { position: absolute; left: 64px; top: 48px; display: flex; align-items: center; gap: 18px; font-size: 22px; }
#hud .tr { position: absolute; right: 64px; top: 52px; font-size: 16px; font-weight: 700; letter-spacing: .3em; color: rgba(255,255,255,.75); }
#hud .bl { position: absolute; left: 64px; bottom: 42px; font-size: 15px; font-weight: 600; letter-spacing: .2em; color: rgba(255,255,255,.6); }
#hud .bar { position: absolute; left: 64px; right: 64px; bottom: 30px; height: 2px; background: rgba(255,255,255,.12); }
#hud .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

/* preview controls (hidden when rendering) */
#controls { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; z-index: 10; font: 14px system-ui, sans-serif; color: #fff; }
#controls button { font: 600 14px system-ui, sans-serif; padding: 8px 18px; border-radius: 999px; border: 0; background: #1f6fff; color: #fff; cursor: pointer; }
#controls input { width: 360px; }
body.render #controls { display: none; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="world">
      <canvas id="bg" width="1920" height="1080"></canvas>
      <div id="scenes"></div>
    </div>
    <div id="hud">
      <div class="tl"></div>
      <div class="tr"></div>
      <div class="bl"></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="flash"></div>
    <div id="grain"></div>
    <div id="vignette"></div>
  </div>
</div>
<div id="controls">
  <button id="play">▶ Play</button>
  <input id="scrub" type="range" min="0" max="100" step="0.01" value="0">
  <span id="tc">0.00</span>
</div>
<audio id="music" src="assets/bgm.mp3" preload="auto"></audio>
<script src="mv.js"></script>
</body>
</html>
