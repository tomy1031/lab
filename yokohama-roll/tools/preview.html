<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>model preview</title>
<style>
  html, body { margin: 0; background: #cfe6f5; font-family: sans-serif; }
  canvas { display: block; }
  .lbl { position: absolute; font: 12px/1.2 sans-serif; color: #123; background: #fffc; padding: 1px 4px; border-radius: 3px; transform: translate(-50%, 0); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
// Usage: preview.html?module=models/town_small.js&night=0&ids=can,car
import * as THREE from 'three';
import { makeToyMaterial, nightUniform } from '../js/material.js';

const qs = new URLSearchParams(location.search);
const modPath = qs.get('module') || 'models/town_small.js';
const night = parseFloat(qs.get('night') || '0');
const only = qs.get('ids') ? qs.get('ids').split(',') : null;
nightUniform.value = night;

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(night > 0.5 ? 0x101830 : 0xcfe6f5);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, night > 0.5 ? 0.6 : 1.6));
const sun = new THREE.DirectionalLight(0xffffff, night > 0.5 ? 0.4 : 1.8);
sun.position.set(3, 5, 4);
scene.add(sun);
const mat = makeToyMaterial();

const errors = [];
let protos;
try {
  const mod = await import('../js/' + modPath);
  protos = mod.default || mod.PROTOS;
} catch (e) { errors.push('import: ' + e.message); }

const items = [];
if (protos) {
  for (const [id, p] of Object.entries(protos)) {
    if (only && !only.includes(id)) continue;
    const variants = p.variants && p.variants.length ? p.variants : [undefined];
    try {
      const g = p.build(variants[0]);
      g.computeBoundingBox();
      items.push({ id, p, g });
    } catch (e) { errors.push(id + ': ' + e.message); }
  }
}

// Each model is drawn in its own viewport cell, auto-framed, with its real size printed.
const n = Math.max(items.length, 1);
const cols = Math.ceil(Math.sqrt(n * W / H));
const rows = Math.ceil(n / cols);
const cw = W / cols, ch = H / rows;
const cam = new THREE.PerspectiveCamera(35, cw / ch, 0.01, 10000);
renderer.setScissorTest(true);
renderer.autoClear = false;
items.forEach((it, i) => {
  const c = i % cols, r = Math.floor(i / cols);
  const mesh = new THREE.Mesh(it.g, mat);
  scene.add(mesh);
  const bb = it.g.boundingBox; const size = new THREE.Vector3(); bb.getSize(size);
  const center = new THREE.Vector3(); bb.getCenter(center);
  const rad = size.length() / 2 || 1;
  const dir = new THREE.Vector3(1.0, 0.7, 1.3).normalize();
  cam.position.copy(center).addScaledVector(dir, rad / Math.tan(THREE.MathUtils.degToRad(17)) * 1.25);
  cam.near = rad / 50; cam.far = rad * 50; cam.updateProjectionMatrix();
  cam.lookAt(center);
  const x = c * cw, y = H - (r + 1) * ch;
  renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
  renderer.render(scene, cam);
  scene.remove(mesh);
  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.style.left = (x + cw / 2) + 'px'; lbl.style.top = (r * ch + 2) + 'px';
  const tris = it.g.attributes.position.count / 3;
  lbl.textContent = `${it.id}「${it.p.name}」 ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)}m  ${tris|0}tri`;
  document.body.appendChild(lbl);
});
window.__previewDone = { count: items.length, errors };
if (errors.length) {
  const e = document.createElement('pre');
  e.style.cssText = 'position:absolute;bottom:0;left:0;color:#b00;background:#fff;margin:0;padding:6px';
  e.textContent = errors.join('\n');
  document.body.appendChild(e);
}
</script>
</body>
</html>
