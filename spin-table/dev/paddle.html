<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>paddle model</title>
<script type="importmap">{ "imports": { "three": "../js/vendor/three.module.min.js" } }</script>
<style>html,body{margin:0;background:#20242c;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { buildPaddle } from '../js/paddlemesh.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio);
r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x2a2f38);
const pm = new THREE.PMREMGenerator(r);
const env = new THREE.Scene(); env.background = new THREE.Color(0x404858);
const l1 = new THREE.Mesh(new THREE.PlaneGeometry(4, 1), new THREE.MeshBasicMaterial({ color: 0xffffff })); l1.position.set(0, 3, 0); l1.rotation.x = Math.PI / 2; env.add(l1);
s.environment = pm.fromScene(env, 0.02).texture;
s.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(1, 2, 2); s.add(d);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 10);
const views = [[0, 0.06, 0.62, 0], [0, 0.06, -0.62, 0], [0.5, 0.1, 0.4, 0]];
const items = [];
const opts = [{ fh: 'inverted', bh: 'inverted' }, { fh: 'inverted', bh: 'long', bhColor: 'black' }, { fh: 'short', bh: 'tacky', fhColor: 'red' }];
for (let i = 0; i < 3; i++) { const p = buildPaddle(opts[i]); p.position.set((i - 1) * 0.2, -0.06, 0); s.add(p); items.push(p); }
const v = Number(q.get('v') || 0);
items[0].rotation.y = v === 1 ? Math.PI : v === 2 ? 0.9 : 0.25; items[1].rotation.y = v === 1 ? Math.PI : -2.6; items[2].rotation.y = v === 2 ? 1.5 : 0.7;
cam.position.set(0, 0.05, 0.9); cam.lookAt(0, 0.05, 0);
r.render(s, cam); window.done = true;
</script></body></html>
