<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>無人島サバイバル</title>
<meta name="description" content="持ち物はひとつだけ。無人島で何日生き延びられるか。ハンドジェスチャーで釣り・狩り・採集、自由な錬成、仲間との会話（Gemini Live）。three.js / MediaPipe">
<meta name="theme-color" content="#123a3f">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script>
  // window.ISLE exists before any module runs, so even an import failure is reported
  window.ISLE = window.ISLE || { ready: false, errors: [], debug: {} };
  addEventListener('error', (e) => window.ISLE.errors.push(String(e.message || e)));
  addEventListener('unhandledrejection', (e) => window.ISLE.errors.push('promise: ' + String(e.reason && e.reason.message || e.reason)));
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"
  }
}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>

<!-- in-game HUD (filled by js/ui/hud.js) -->
<div id="hud" class="hidden">
  <div id="hud-stats"></div>
  <div id="hud-clock"></div>
  <div id="hud-status"></div>
  <div id="hud-hotbar"></div>
  <div id="hud-prompt"></div>
  <div id="hud-action"></div>
  <div id="hud-toasts"></div>
  <div id="hud-subtitle"></div>
  <div id="crosshair"></div>
  <canvas id="cam-preview" width="240" height="180" class="hidden"></canvas>
  <div id="hud-companion"></div>
  <div id="touch-ui">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="touch-buttons"></div>
  </div>
</div>

<!-- full-screen menus (title, setup, inventory, craft, build, journal, map, pause, result) -->
<div id="screens"></div>
<div id="hand-cursor" class="hidden"></div>
<div id="fade"></div>

<noscript><p style="padding:24px">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
