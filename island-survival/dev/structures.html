<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>structures viewer (dev)</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9fd0e8;font:12px sans-serif}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:8px;top:8px;background:#000a;color:#fff;padding:6px 10px;border-radius:6px;max-width:60ch}</style></head>
<body><canvas id="gl"></canvas><div id="hud">structures — ?only=id1,id2 &amp;roof=palm|mat|tarp|bark &amp;stage=frame|done</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildMesh, MESH_IDS } from '../js/world/structures.js';
import { BUILDINGS } from '../js/data/buildings.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const R = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fd0e8'); scene.fog = new THREE.Fog('#9fd0e8', 60, 200);
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight('#dff0ff', '#a08c64', 1.1));
const sun = new THREE.DirectionalLight('#fff1d0', 2.6); sun.position.set(-14, 22, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 80 });
sun.shadow.bias = -0.0008; scene.add(sun);

const only = q.get('only')?.split(',');
const ids = (only || MESH_IDS.filter((id) => BUILDINGS[id])).filter((id) => BUILDINGS[id]);
const roof = q.get('roof') || 'palm';
const both = !q.get('stage');
const cols = Math.min(ids.length, +(q.get('cols') || 6));
const cell = +(q.get('cell') || 9);
const rowsPer = both ? 2 : 1;
const rows = Math.ceil(ids.length / cols);
const W = cols * cell, H = rows * cell * rowsPer;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + 40, H + 40), new THREE.MeshStandardMaterial({ color: '#e0cd9c', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function label(text, x, z, y = 0.02) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#0008'; g.fillRect(0, 0, 256, 64); g.fillStyle = '#fff'; g.font = '22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 32);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.8), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m);
}
const stats = [];
ids.forEach((id, i) => {
  const cx = (i % cols) * cell - W / 2 + cell / 2, cz = Math.floor(i / cols) * cell * rowsPer - H / 2 + cell / 2;
  const defs = both ? [['frame', 0.5, 0], ['done', 1, cell]] : [[q.get('stage'), +(q.get('progress') || 0.5), 0]];
  for (const [stage, progress, dz] of defs) {
    const m = buildMesh(id, { stage, progress, materials: { roof, tent: q.get('tent') || 'orange' } });
    m.position.set(cx, 0, cz + dz); scene.add(m);
    if (stage === 'done') stats.push(`${id}:${m.userData.tris}`);
    label(`${BUILDINGS[id].name} (${stage})`, cx, cz + dz + cell * 0.38);
  }
});
window.STATS = stats;
const ctl = new OrbitControls(cam, canvas);
function resize() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// camera: ?cx=&cz=&dist=&az=&el=  (target in world coords, relative to grid centre)
const dist = +(q.get('dist') || Math.max(W, H) * 0.9), az = +(q.get('az') || 0.35), el = +(q.get('el') || 0.75);
const tx = +(q.get('cx') || 0), tz = +(q.get('cz') || 0);
ctl.target.set(tx, 0.8, tz);
cam.position.set(tx + Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, tz + Math.cos(az) * Math.cos(el) * dist);
ctl.update();
function frame() { R.render(scene, cam); requestAnimationFrame(frame); }
frame();
window.READY = true;
</script></body></html>
